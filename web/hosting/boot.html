<style>
  body { background: #000; }
  main { display: none; }
  #game-boot { position: fixed; inset: 0; display: grid; place-content: center;
    padding: 24px; background: #000; color: #d9cba5; text-align: center;
    font: 16px/1.6 Georgia, serif; }
  #boot-progress { width: min(320px, 80vw); height: 4px; margin: 20px auto 0;
    accent-color: #b79b54; }
  #boot-retry { margin: 24px auto 0; padding: 10px 20px; color: #d9cba5;
    background: #211e15; border: 1px solid #9a8349; font: inherit; cursor: pointer; }
  html[data-setup] main { display: block; }
  html[data-setup] #game-boot { display: none; }
  [hidden] { display: none !important; }
</style>
<section id="game-boot" aria-label="Loading Majesty">
  <output id="boot-status" role="status" hidden></output>
  <progress id="boot-progress" hidden aria-label="Loading game"></progress>
  <button id="boot-retry" hidden>Retry</button>
</section>
