<style>
  html:not([data-setup]) body { overflow: hidden; padding: 0; }
  #instant-home { position: fixed; inset: 0; z-index: 2; background: #000;
    display: grid; place-items: center; }
  #home-art { position: relative; width: min(100vw, calc(100dvh * 1280 / 633));
    aspect-ratio: 1280 / 633; }
  #home-art img { display: block; width: 100%; height: 100%; }
  #home-art button, #home-art a { position: absolute; padding: 0; cursor: pointer;
    background: transparent; border: 0; color: transparent; }
  #home-art :is(button,a):is(:hover,:focus-visible), #home-art [aria-pressed=true] {
    outline: 2px solid #e4ce88; outline-offset: -2px; border-radius: 5px; }
  body[data-game-ready] #instant-home, html[data-setup] #instant-home { display: none; }
  #native-player { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  #game-boot { z-index: 3; pointer-events: none; background: transparent; }
  #game-boot:has(#boot-status:not([hidden])) { background: #000d; }
  #boot-retry { pointer-events: auto; }
</style>
<section id="instant-home" aria-label="Majesty home menu">
  <div id="home-art">
    <img src="/hosting/home-menu.webp" width="1280" height="633" alt="Majesty" fetchpriority="high">
    <button data-home-action="play" aria-label="Play Game" style="left:20.6%;top:74.3%;width:10.9%;height:3.6%"></button>
    <button data-home-action="multiplayer" aria-label="Multiplayer" style="left:31.8%;top:74.3%;width:10.9%;height:3.6%"></button>
    <button data-home-action="load" aria-label="Load Game" style="left:20.6%;top:78.8%;width:10.9%;height:3.6%"></button>
    <button data-home-action="settings" aria-label="Adjust Settings" style="left:31.8%;top:78.8%;width:10.9%;height:3.6%"></button>
    <button data-home-action="credits" aria-label="Credits" style="left:57.3%;top:74.3%;width:10.9%;height:3.6%"></button>
    <button data-home-action="scores" aria-label="High Scores" style="left:68.5%;top:74.3%;width:10.9%;height:3.6%"></button>
    <button data-home-action="cinematic" aria-label="Cinematic" style="left:57.3%;top:78.8%;width:10.9%;height:3.6%"></button>
    <a href="https://boland.co" aria-label="Exit Game" style="left:68.5%;top:78.8%;width:10.9%;height:3.6%"></a>
    <button data-home-action="mods" aria-label="Change Mods" style="left:29.2%;top:88.6%;width:18.2%;height:4.4%"></button>
    <button data-home-action="activate" aria-label="Activate Mods" style="left:52.5%;top:88.6%;width:18.2%;height:4.4%"></button>
  </div>
</section>
