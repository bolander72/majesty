// Opt-in visible diagnostics make resize verification possible without

function reportViewport(t) {

const MAX_LOG_LINES = 512, MAX_LOG_CHARS = 2048;
const MAX_CONSOLE_LINES = 256, MAX_CONSOLE_CHARS = 262144, MAX_CONSOLE_LINES_PER_SECOND = 16;

  if (consoleWindowLines >= MAX_CONSOLE_LINES_PER_SECOND) return;

      details.id = "debug-log";

      details.appendChild(document.createElement("summary")).textContent = "Runtime diagnostics";

async function gameId() {
  const parts = location.pathname.split("/").filter(Boolean);
  if (parts.length && parts[parts.length - 1].includes(".")) parts.pop();
  return decodeURIComponent(parts[parts.length - 1] || "majesty");
}

// Hash actual imported bytes and paths, including files added by content mods.
// Generated viewport layouts and the writable profile live in a separate tree. All peers must
// run the same WASM build, original executable and content before room joining.
async function contentManifest(dir, game, signal, cacheKey) {
  signal?.throwIfAborted();
  await dir.getFileHandle(".manifest.json"); // completed original import required
  const hex = b => Array.from(new Uint8Array(b), v => v.toString(16).padStart(2, "0")).join("");
  const entries = [];
  // Native rule adapters can select opt-in scenarios. Peers must agree on
  // every rule parameter, including unknown future rules, before joining.
  const rules = [...new URLSearchParams(playerSearch)].filter(([k]) => k.startsWith("RECOMP_RULE_"));
  if (game.id === "majesty" && !rules.some(([key]) => key === "RECOMP_RULE_INVENTORY_COMPAT"))
    rules.push(["RECOMP_RULE_INVENTORY_COMPAT", "1"]);
  if (rules.length > 16 || new Set(rules.map(([k]) => k)).size !== rules.length ||
      rules.some(([k, v]) => !/^RECOMP_RULE_[A-Z0-9_]{1,60}$/.test(k) || !/^[a-zA-Z0-9_-]{1,80}$/.test(v)))
    throw new Error("Invalid or duplicate game rule parameter");
  if (rules.length) entries.push("rules-v1\0" + JSON.stringify(rules.sort(([a], [b]) => a < b ? -1 : a > b ? 1 : 0)));
  const files = [];
  async function collect(folder, prefix = "") {
    for await (const [name, handle] of folder.entries()) {
      signal?.throwIfAborted();
      const path = prefix + name;
      if (handle.kind === "directory") await collect(handle, path + "/");
      else if (path !== ".manifest.json") files.push([path, handle]);
    }
  }
  await collect(dir);
  files.sort((a, b) => a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0);
  const {cachedFileHashes} = await import("../hosting/content-cache.mjs");
  const fresh = frontierProfilePath !== null ||
    prepareHeroRestore !== null || rules.some(([key]) => key !== "RECOMP_RULE_INVENTORY_COMPAT");
  const hashes = await cachedFileHashes(files, cacheKey, {signal, fresh});
  for (const value of hashes) entries.push(value);
  signal?.throwIfAborted();
  const digest = async values => hex(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(values.join("\n"))));
  const content = await digest(entries);
  // Regional checkpoints bind to actual imported bytes, independent of
  // session rules, restore toggles and compatible host-only WASM rebuilds.
  const assets = await digest(entries.filter(value => !value.startsWith("rules-v1\0")));
  if (!/^[a-f0-9]{64}$/.test(game.engineSha256 || "")) throw new Error("The launcher is missing this engine's identity. Re-stage the web build.");
  return { session: game.engineSha256 + ":" + game.sha256 + ":" + content,
           checkpoint: game.sha256 + ":" + assets };
}

  : Promise.resolve();
let preparedRootGames;

    }))
  : new URLSearchParams(playerSearch).has("RECOMP_RULE_FRONTIER_TRANSFER")
    ? import("../world/paired-session.mjs").then(({startPairedPlayer}) => startPairedPlayer(start))
    : import("../content/edition-session.mjs").then(({startEditionPlayer}) => startEditionPlayer(start))); }).catch((e) => status(e.message, true));
