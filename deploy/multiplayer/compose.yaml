services:
  relay:
    build:
      context: .
      dockerfile: Dockerfile.relay
    command: ["python", "room_relay.py", "--host", "0.0.0.0", "--port", "8002", "--origin", "https://${MAJESTY_HOST:?Set MAJESTY_HOST to your domain}"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 32
    logging:
      options: {max-size: "2m", max-file: "2"}
  web:
    image: caddy:2-alpine
    environment:
      MAJESTY_HOST: ${MAJESTY_HOST:?Set MAJESTY_HOST to your domain}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on: [relay]
    mem_limit: 256m
    pids_limit: 64
    logging:
      options: {max-size: "2m", max-file: "2"}
volumes:
  caddy_data:
  caddy_config:
